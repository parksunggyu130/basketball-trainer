name: 새 코치님 영상 추가
on:
  schedule:
    - cron: '0 21 * * *'   # 매일 오전 6시 (한국 시간)
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node .github/scripts/new-videos.mjs
        env:
          YT_API_KEY: ${{ secrets.YT_API_KEY }}
      - name: 바뀐 게 있으면 올리기
        run: |
          git add coach3.js .github/data/new-videos.json
          if git diff --cached --quiet; then echo "새 영상 없음"; exit 0; fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "새 코치님 영상 자동 추가"
          git push
