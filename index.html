<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#E8641B">
<title>농구 훈련</title>
<link rel="icon" href="icons/icon-192.png">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="농구 훈련">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
:root{
  --bg:#F6F4F1;--card:#FFFFFF;--ink:#1D1B19;--sub:#6B655F;--line:#E6E1DB;
  --acc:#E8641B;--acc-ink:#FFFFFF;--acc-soft:#FDEBDF;--good:#1F8A5B;--good-soft:#E2F4EA;--bad:#C2412D;--bad-soft:#FBE7E3;
  --chip:#EFEAE4;--shadow:0 1px 2px rgba(0,0,0,.06),0 2px 8px rgba(0,0,0,.04);
}
@media (prefers-color-scheme:dark){
  :root{--bg:#141210;--card:#1F1C19;--ink:#F2EEE9;--sub:#A59E96;--line:#332E29;
    --acc:#F07A34;--acc-ink:#1A0E06;--acc-soft:#3A2416;--good:#4CC08A;--good-soft:#173528;--bad:#F07A66;--bad-soft:#3B1E19;--chip:#2A2622;--shadow:none}
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 system-ui,-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}
body{padding-bottom:calc(72px + env(safe-area-inset-bottom))}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--acc)}
.top{position:sticky;top:0;z-index:10;background:var(--bg);padding:calc(10px + env(safe-area-inset-top)) 16px 8px;display:flex;align-items:center;gap:10px}
.top h1{font-size:21px;margin:0;flex:1;font-weight:800;letter-spacing:-.3px}
.top h1 .by{font-size:13px;font-weight:700;color:var(--acc);margin-left:8px;letter-spacing:.5px;vertical-align:middle}
.iconbtn{border:0;background:var(--chip);width:40px;height:40px;border-radius:12px;font-size:19px;display:grid;place-items:center;flex:none}
.wrap{padding:0 16px;max-width:760px;margin:0 auto}
.search{width:100%;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:11px 14px;outline:none}
.search:focus{border-color:var(--acc)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:10px 0;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{border:0;background:var(--chip);border-radius:999px;padding:7px 14px;white-space:nowrap;font-size:15px}
.chip.on{background:var(--acc);color:var(--acc-ink);font-weight:700}
.list{display:grid;gap:10px;padding:4px 0 16px}
@media (min-width:640px){.list{grid-template-columns:1fr 1fr}}
.card{background:var(--card);border-radius:16px;box-shadow:var(--shadow);border:1px solid var(--line)}
.drill{padding:14px 14px 12px;display:flex;flex-direction:column;gap:6px;text-align:left;border:1px solid var(--line);width:100%}
.drill .row{display:flex;align-items:center;gap:8px}
.drill .nm{font-weight:750;font-size:17px;flex:1}
.drill .sm{color:var(--sub);font-size:14px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tag{font-size:12px;padding:2px 8px;border-radius:6px;background:var(--chip);color:var(--sub);white-space:nowrap}
.tag.lv-입문{background:var(--good-soft);color:var(--good)}
.tag.lv-초급{background:var(--acc-soft);color:var(--acc)}
.tag.lv-중급{background:var(--bad-soft);color:var(--bad)}
.tag.lv-고급{background:var(--ink);color:var(--bg)}
.tag.vid{background:var(--acc);color:var(--acc-ink)}
.star{font-size:18px;color:var(--acc)}
.empty{color:var(--sub);text-align:center;padding:40px 10px}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--card);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom)}
.nav a{flex:1;text-align:center;padding:9px 0 8px;color:var(--sub);text-decoration:none;font-size:12px}
.nav a b{display:block;font-size:21px;line-height:1.2;font-weight:400}
.nav a.on{color:var(--acc);font-weight:700}

/* 상세 */
.hero{padding:2px 0 10px}
.hero h2{margin:0;font-size:24px;letter-spacing:-.4px}
.hero .en{color:var(--sub);font-size:14px}
.hero p{margin:8px 0 0}
.meta{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
.meta div{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 10px}
.meta small{display:block;color:var(--sub);font-size:12px}
.meta span{font-size:14px;font-weight:600}
.player{background:#000;border-radius:16px;overflow:hidden;position:relative;aspect-ratio:16/9}
.player.tall{aspect-ratio:9/16;max-height:70vh;margin:0 auto}
.player video,.player iframe,.player>div{width:100%;height:100%;display:block;border:0}
.player.mirror video,.player.mirror iframe{transform:scaleX(-1)}
.novid{padding:18px;display:flex;flex-direction:column;gap:10px}
.novid h3{margin:0;font-size:17px}
.novid p{margin:0;color:var(--sub);font-size:14px}
.btn{border:0;border-radius:12px;padding:11px 14px;background:var(--chip);font-weight:600;font-size:15px}
.btn.pri{background:var(--acc);color:var(--acc-ink)}
.btn.sm{padding:7px 11px;font-size:14px;border-radius:10px}
.btn.ghost{background:transparent;border:1px solid var(--line)}
.btns{display:flex;flex-wrap:wrap;gap:8px}
.ctrl{display:flex;flex-direction:column;gap:8px;padding:10px 0 4px}
.ctrl .row{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.ctrl .lbl{font-size:13px;color:var(--sub);width:40px;flex:none}
.seg{display:flex;background:var(--chip);border-radius:10px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;border-radius:8px;padding:6px 10px;font-size:14px;font-weight:600;color:var(--sub)}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
.time{font-variant-numeric:tabular-nums;font-size:14px;color:var(--sub);margin-left:auto}
.ab.on{background:var(--acc);color:var(--acc-ink)}
.marks{display:flex;gap:6px;flex-wrap:wrap}
.mark{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:5px 10px;font-size:13px}
.mark b{color:var(--acc);font-variant-numeric:tabular-nums;margin-right:4px}
.sec{margin:18px 0 0}
.sec h3{font-size:18px;margin:0 0 8px;display:flex;align-items:center;gap:8px}
.steps{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.steps li{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;gap:12px;align-items:flex-start}
.steps li.done{opacity:.55}
.num{flex:none;width:28px;height:28px;border-radius:50%;background:var(--acc);color:var(--acc-ink);display:grid;place-items:center;font-weight:800;font-size:14px;border:0}
.steps li.done .num{background:var(--good)}
.steps .tx{flex:1;font-size:16px}
.steps .tt{display:flex;gap:6px;margin-top:6px}
.tchip{border:1px dashed var(--line);background:transparent;border-radius:8px;padding:2px 8px;font-size:12px;color:var(--sub)}
.tchip.set{border-style:solid;border-color:var(--acc);color:var(--acc);font-weight:700}
.checks{display:grid;gap:6px}
.checks label{display:flex;gap:10px;align-items:center;background:var(--good-soft);border-radius:12px;padding:10px 12px}
.checks input{width:20px;height:20px;accent-color:var(--good);flex:none}
.mist{display:grid;gap:8px}
.mist div{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.mist .x{color:var(--bad);font-weight:700}
.mist .o{color:var(--good);margin-top:2px}
.train{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.counter,.timer{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px;text-align:center}
.counter .n,.timer .n{font-size:40px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.1}
.counter small,.timer small{color:var(--sub);font-size:13px}
.bigplus{width:100%;margin-top:8px;padding:14px;font-size:20px}
.mini{display:flex;gap:6px;justify-content:center;margin-top:6px;flex-wrap:wrap}
.timer.ring{border-color:var(--acc);background:var(--acc-soft)}
textarea,.inp{width:100%;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:10px 12px;outline:none}
textarea:focus,.inp:focus{border-color:var(--acc)}
.feel{display:flex;gap:8px}
.feel button{flex:1;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:10px 0;font-size:15px}
.feel button.on{border-color:var(--acc);background:var(--acc-soft);font-weight:700}
.note{font-size:13px;color:var(--sub)}
.log{display:grid;gap:8px}
.log .day{font-weight:700;margin:14px 0 2px;color:var(--sub);font-size:14px}
.log .it{padding:12px;display:flex;gap:10px;align-items:center}
.log .it div{flex:1}
.log .it small{color:var(--sub)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:6px 0 4px}
.stats div{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px;text-align:center}
.stats b{display:block;font-size:24px;color:var(--acc)}
.stats small{color:var(--sub);font-size:12px}
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:640px;border-radius:20px 20px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));max-height:88vh;overflow:auto;display:flex;flex-direction:column;gap:12px}
.sheet h3{margin:0;font-size:19px}
.field{display:flex;flex-direction:column;gap:4px}
.field span{font-size:13px;color:var(--sub)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.toast{position:fixed;left:50%;bottom:calc(86px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;z-index:60;font-size:14px;max-width:90vw;text-align:center}
.tip{background:var(--acc-soft);border-radius:14px;padding:12px;font-size:14px}
.tip b{color:var(--acc)}
.court{background:#E4CBA6;border-radius:16px;overflow:hidden;line-height:0}
.courtsvg{display:block;width:100%;height:auto;max-height:64vh;margin:0 auto;user-select:none;-webkit-user-select:none}
.courtsvg.full{max-height:82vh}
.courtsvg.edit{touch-action:none}
.mini.full{width:52px}
.courtsvg.edit [data-pid]{cursor:grab}
.courtsvg.edit [data-ball]{pointer-events:auto;cursor:grab}
.legend{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px;color:var(--sub);padding:6px 2px 0}
.legend span{display:inline-flex;align-items:center;gap:4px}
.lg{display:inline-block;width:11px;height:11px}
.lg.o{background:#1F5FBF;border-radius:50%}.lg.d{border:2px solid #C8372D;border-radius:3px;background:#fff}.lg.b{background:#F07A2E;border-radius:50%}
.pctl{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:10px}
.pstep{font-weight:800;font-variant-numeric:tabular-nums;min-width:52px;text-align:center}
.pnote{background:var(--acc-soft);border-radius:14px;padding:12px 14px;margin-top:10px;font-size:16px;min-height:52px}
.pnote b{color:var(--acc);margin-right:4px}
.tgl{display:inline-flex;gap:8px;align-items:center;margin-top:10px;font-size:14px}
.tgl input{width:18px;height:18px;accent-color:var(--acc)}
.steps li.cur{border-color:var(--acc);box-shadow:0 0 0 2px var(--acc-soft)}
.steps li[data-pi]{cursor:pointer}
.pcard{flex-direction:row;align-items:center;gap:12px;text-decoration:none;color:inherit}
.mini{width:88px;height:auto;border-radius:10px;flex:none}
.seg.wide{width:100%}.seg.wide button{flex:1}
.frames{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.fchip{border:1px solid var(--line);background:var(--card);border-radius:10px;min-width:40px;height:38px;font-weight:700;padding:0 10px}
.fchip.on{background:var(--acc);color:var(--acc-ink);border-color:var(--acc)}
.fchip.add{border-style:dashed;color:var(--acc)}
.fchip.del{color:var(--bad);font-weight:600;font-size:14px}
.cmpbtn{display:flex;flex-direction:column;align-items:center;gap:2px;width:100%;margin-top:18px;padding:14px;text-decoration:none;font-size:17px}
.cmpbtn small{font-weight:500;font-size:12px;opacity:.85}
.srcs{display:grid;gap:8px}
@media (min-width:640px){.srcs{grid-template-columns:1fr 1fr}}
.src{display:flex;align-items:center;gap:8px;padding:10px 12px}
.src>div:first-child{flex:1;min-width:0}
.src small{color:var(--sub);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stage{display:grid;gap:6px;margin-top:10px}
.stage.stack{grid-template-columns:1fr}
.stage.side{grid-template-columns:1fr 1fr}
.stage.over{position:relative;grid-template-columns:1fr}
.pane{position:relative;background:#000;border-radius:12px;overflow:hidden}
.stage.stack .pane{height:34vh;min-height:200px}
.stage.side .pane{height:56vh}
.stage.over .pane{height:60vh}
.stage.over #pref{position:absolute;inset:0;z-index:2;background:transparent}
.stage.over #pmy .plabel{top:auto;bottom:8px}
.stage.over #pmy .mirbtn{top:auto;bottom:8px}
.vbox{position:absolute;inset:0}
.vbox video{width:100%;height:100%;object-fit:contain;display:block}
.vbox canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.plabel{position:absolute;left:8px;top:8px;z-index:3;background:rgba(0,0,0,.6);color:#fff;font-size:12px;font-weight:700;padding:2px 8px;border-radius:6px}
#pref .plabel{color:#3DDC97}#pmy .plabel{color:#FF9F43}
.mirbtn{position:absolute;right:8px;top:8px;z-index:3;border:0;background:rgba(0,0,0,.6);color:#fff;border-radius:8px;width:34px;height:30px}
.ph{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:16px;text-align:center;color:#ddd;font-size:14px;z-index:1}
.ph p{margin:0}
.ph[hidden]{display:none}
.ovl{display:flex;align-items:center;gap:10px;margin-top:8px}
.ovl[hidden]{display:none}
.scrub{width:100%;accent-color:var(--acc)}
.atbl{width:100%;border-collapse:collapse;background:var(--card);border-radius:12px;overflow:hidden;font-variant-numeric:tabular-nums}
.atbl th,.atbl td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:center;font-size:15px}
.atbl td:first-child{text-align:left}
.atbl td.bad{color:var(--bad);font-weight:800}
.fmt{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-top:12px;display:grid;gap:4px}
.fmth{display:flex;justify-content:space-between;margin-bottom:4px}
.fmth .good{color:var(--good);font-weight:800}
.fmti{font-size:14px;color:var(--sub)}
.fmti.ok{color:var(--good)}
.tag.ms1{background:var(--chip);color:var(--sub)}
.tag.ms2{background:var(--acc-soft);color:var(--acc)}
.tag.ms3{background:var(--good-soft);color:var(--good)}
.hero h2 .tag{font-size:13px;vertical-align:middle;font-weight:600}
.sec h3 .btn{font-size:13px}
.jlist{display:grid;gap:8px}
.jcard{padding:12px;display:grid;gap:8px;margin-bottom:8px}
.jlist .jcard{margin-bottom:0}
.jhead{display:flex;gap:8px;align-items:center}
.jname{font-weight:750;color:inherit;text-decoration:none;display:block}
.jhead small{color:var(--sub);font-size:13px}
.jrow small{color:var(--sub);font-size:12px;display:block}
.jrow div{white-space:pre-wrap;font-size:15px}
.tsit{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;font-size:16px}
.tsit small,.trem small{display:block;font-size:12px;color:var(--sub);font-weight:600;margin-bottom:2px}
.tlist{list-style:none;margin:14px 0 0;padding:0;display:grid;gap:10px}
.tlist li{display:flex;gap:12px;align-items:flex-start;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px}
.tlist b{font-size:16px}
.tlist p{margin:4px 0 0;color:var(--ink);font-size:15px;line-height:1.6}
.trem{background:var(--acc-soft);border-radius:14px;padding:12px 14px;margin-top:14px;font-size:17px;font-weight:700}
.trem small{color:var(--acc)}
a.chip{text-decoration:none;color:inherit}
/* ---------- 쉬운 메뉴 ---------- */
html,body{font-size:17px}
.iconbtn{width:46px;height:46px;font-size:20px}
.chip{padding:9px 16px;font-size:16px}
.btn.sm{padding:9px 12px;font-size:15px}
.seg button{padding:8px 12px;font-size:15px}
.drill .nm{font-size:18px}
.nav a{font-size:13px;font-weight:600;padding:8px 0 9px}
.nav a b{font-size:25px}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:10px}
@media (min-width:640px){.tiles{grid-template-columns:repeat(4,minmax(0,1fr))}}
.tile{border:1px solid var(--line);background:var(--card);border-radius:18px;padding:16px 12px;display:flex;flex-direction:column;align-items:center;gap:4px;box-shadow:var(--shadow);min-height:118px;justify-content:center}
.tile span{font-size:40px;line-height:1.1}
.tile b{font-size:18px}
.tile small{color:var(--sub);font-size:13px}
.tile:active{transform:scale(.97)}
.cathead{display:flex;align-items:center;gap:12px;margin-top:10px}
.cathead b{font-size:20px}
.coaches{display:grid;gap:10px}
@media (min-width:640px){.coaches{grid-template-columns:1fr 1fr}}
.coachcard{padding:12px;display:flex;flex-direction:column;gap:10px}
.cc-main{border:0;background:none;text-align:left;padding:0;display:flex;flex-direction:column;gap:2px}
.cc-main b{font-size:18px}
.cc-main small{color:var(--acc);font-size:14px;font-weight:700}
.cc-links{display:flex;gap:8px}
.coachbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:var(--acc-soft);border-radius:12px;padding:8px 12px;margin:0 0 10px}
.coachbar span{flex:1;min-width:150px}
.player.ig{aspect-ratio:auto;height:min(78vh,700px);background:#fff;max-width:420px;margin:0 auto}
.player.ig iframe{width:100%;height:100%;border:0}
.addcoach{text-decoration:none;color:inherit;border-style:dashed;justify-content:center}
.addcoach b{font-size:17px;color:var(--acc)}
.addcoach small{color:var(--sub)}
.sec h3 .btn{font-weight:600}
.tag.coach{background:var(--acc-soft);color:var(--acc);font-weight:700}
.row.basic{gap:8px}
.row.basic .btn{flex:1;padding:13px 8px;font-size:16px}
.row.basic .bigpp{flex:1.6}
.row.basic .seg button{padding:11px 8px;font-size:16px}
.advtgl{width:100%;margin-top:2px}
.advbox{display:flex;flex-direction:column;gap:8px}
.advbox[hidden]{display:none}
.follow{width:100%;margin-top:16px;padding:15px;font-size:18px}
.follow-ov{position:fixed;inset:0;z-index:65;background:var(--bg);display:flex;flex-direction:column;padding:calc(14px + env(safe-area-inset-top)) 18px calc(18px + env(safe-area-inset-bottom))}
.fo-top{display:flex;align-items:center;gap:10px}
.fo-top b{flex:1;font-size:19px}
.fo-n{color:var(--acc);font-weight:900;font-size:22px;margin-top:18px}
.fo-t{flex:1;font-size:27px;line-height:1.55;font-weight:700;margin-top:10px;overflow:auto}
.fo-dots{display:flex;gap:6px;justify-content:center;margin:12px 0}
.fo-dots i{width:10px;height:10px;border-radius:50%;background:var(--line)}
.fo-dots i.on{background:var(--acc)}
.fo-btns{display:flex;gap:10px}
.fo-btns .btn{flex:1;padding:18px 8px;font-size:19px}
.fo-btns .btn:disabled{opacity:.4}
.pctl2{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center;margin-top:10px}
.pctl2 .btn{padding:15px 8px;font-size:18px}
.pctl2 .btn:disabled{opacity:.4}
.pplay{width:100%;margin-top:10px;padding:15px;font-size:18px;background:var(--good);color:#fff}
.tapnext{cursor:pointer}
.pnote{font-size:18px;line-height:1.55}
.tgl{font-size:16px;margin-top:12px}
.tgl input{width:22px;height:22px}
.fchip{min-width:46px;height:46px;font-size:17px}
#tools button{padding:11px 6px;font-size:15px}
.srcn{font-size:22px;font-weight:900;color:var(--acc)}

<script>
'use strict';
var $=function(s,r){return (r||document).querySelector(s)};
var $$=function(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s))};
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function fmt(t){t=Math.max(0,t||0);var m=Math.floor(t/60),s=t-m*60;return m+':'+(s<10?'0':'')+s.toFixed(1)}
function fmtS(t){t=Math.max(0,Math.round(t||0));var m=Math.floor(t/60),s=t%60;return m+':'+(s<10?'0':'')+s}
function today(){var d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function toast(m){var t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);setTimeout(function(){t.remove()},2200)}

var isNative=!!(window.Capacitor&&window.Capacitor.isNativePlatform&&window.Capacitor.isNativePlatform());
/* JS 패키지를 번들하지 않으므로 브리지의 nativePromise / addListener 를 직접 쓴다 */
function plugin(name){
  var C=window.Capacitor;
  if(!isNative||!C||typeof C.nativePromise!=='function') return null;
  return {call:function(m,o){return C.nativePromise(name,m,o||{})},addListener:function(ev,cb){return C.addListener(name,ev,cb)}};
}
function openExternal(url){ if(isNative) location.href=url; else window.open(url,'_blank','noopener') }

/* ================= 저장 ================= */
var KEY='bbtrain.v1';
var S=load();
function load(){
  var d={fav:{},media:{},marks:{},stepT:{},logs:[],custom:[],patterns:[],pnotes:{},mine:{},cref:{},pjournal:[],tnotes:{},ui:{},recent:[],tj:{},demo:{},coaches:[],cvids:{},board:null};
  try{var o=JSON.parse(localStorage.getItem(KEY)||'{}');for(var k in d) if(o[k]) d[k]=o[k]}catch(e){}
  return d;
}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){toast('저장 공간이 부족해요')}}

/* 내 폰 영상은 IndexedDB 에 drill id 로 저장 */
var vdb=(function(){
  var p;
  function db(){return p||(p=new Promise(function(res,rej){var r=indexedDB.open('bbtrain',1);r.onupgradeneeded=function(){r.result.createObjectStore('videos')};r.onsuccess=function(){res(r.result)};r.onerror=function(){rej(r.error)}}))}
  function tx(mode,fn){return db().then(function(d){return new Promise(function(res,rej){var t=d.transaction('videos',mode),q=fn(t.objectStore('videos'));t.oncomplete=function(){res(q&&q.result)};t.onerror=function(){rej(t.error)}})})}
  return {get:function(k){return tx('readonly',function(s){return s.get(k)})},put:function(k,v){return tx('readwrite',function(s){return s.put(v,k)})},del:function(k){return tx('readwrite',function(s){return s.delete(k)})}};
})();

function allDrills(){return DRILLS.concat(S.custom)}
/* 훈련 분류에는 코치님이 직접 시범 보인 영상만: 선수 시범 영상은 '따라해 보기'로 옮긴다 (DEMO_YT + 내가 직접 옮긴 S.demo[yt]) */
function isDemo(d){return S.demo[d.yt]!=null?!!S.demo[d.yt]:DEMO_YT.indexOf(d.yt)>=0}
function demoFix(){
  DRILLS.forEach(function(d){
    if(!d.yt||!d.coach) return;
    if(d.cat0==null) d.cat0=d.cat;
    if(d.cat0==='따라해 보기') return;
    var on=isDemo(d);d.cat=on?'따라해 보기':d.cat0;d.demo=on;
  });
}
function drill(id){return allDrills().filter(function(d){return d.id===id})[0]}
/* 내가 넣은 영상이 먼저, 없으면 코치님 영상 */
function mediaOf(d){return S.media[d.id]||(d.yt?{type:'yt',id:d.yt,start:0,tall:true,coach:true}:d.ig?{type:'ig',code:d.ig}:null)}
function coachTag(d){var c=d.coach&&COACHES[d.coach];return c?'<span class="tag coach">🎬 '+esc(c.name)+'</span>':''}

/* ================= 유튜브 ================= */
function parseYT(url){
  url=(url||'').trim(); if(!url) return null;
  var id=null,m;
  if(/^[\w-]{11}$/.test(url)) id=url;
  else if((m=url.match(/(?:youtu\.be\/|\/shorts\/|\/embed\/|\/live\/|[?&]v=)([\w-]{11})/))) id=m[1];
  if(!id) return null;
  var t=0,tm=url.match(/[?&#](?:t|start)=([\dhms]+)/);
  if(tm){var v=tm[1];if(/^\d+$/.test(v)) t=+v;else{var h=v.match(/(\d+)h/),mi=v.match(/(\d+)m/),s=v.match(/(\d+)s/);t=(h?+h[1]*3600:0)+(mi?+mi[1]*60:0)+(s?+s[1]:0)}}
  return {id:id,start:t,shorts:/\/shorts\//.test(url)};
}
var ytReady=null;
function loadYT(){
  if(ytReady) return ytReady;
  ytReady=new Promise(function(res,rej){
    if(window.YT&&window.YT.Player) return res();
    window.onYouTubeIframeAPIReady=res;
    var s=document.createElement('script');s.src='https://www.youtube.com/iframe_api';
    s.onerror=function(){ytReady=null;rej(new Error('offline'))};
    document.head.appendChild(s);
  });
  return ytReady;
}

function makeLocalPlayer(el,blob){

  var url=URL.createObjectURL(blob);v.src=url;el.appendChild(v);
  return {kind:'local',el:v,
    play:function(){v.play()},pause:function(){v.pause()},paused:function(){return v.paused},
    time:function(){return v.currentTime},seek:function(t){v.currentTime=Math.max(0,t)},
    rate:function(r){v.playbackRate=r},destroy:function(){v.pause();URL.revokeObjectURL(url)}};
}
function makeYTPlayer(el,m){
  var box=document.createElement('div');el.appendChild(box);
  var pl=null,pending=[],ready=false;
  var api={kind:'yt',
    play:function(){ready?pl.playVideo():pending.push('play')},pause:function(){ready&&pl.pauseVideo()},
    paused:function(){return !ready||pl.getPlayerState()!==1},
    time:function(){return ready?pl.getCurrentTime():0},seek:function(t){ready&&pl.seekTo(Math.max(0,t),true)},
    rate:function(r){ready&&pl.setPlaybackRate(r)},destroy:function(){pl&&pl.destroy()}};
  loadYT().then(function(){
    pl=new YT.Player(box,{videoId:m.id,playerVars:{start:Math.floor(m.start||0),playsinline:1,rel:0,modestbranding:1,origin:location.origin},
      events:{onReady:function(){ready=true;if(P&&P.rateV) pl.setPlaybackRate(P.rateV);pending.forEach(function(a){api[a]()});pending=[]},
        onError:function(e){el.innerHTML='<div class="novid" style="background:var(--card);height:100%"><h3>여기서는 재생이 안 되는 영상이에요</h3><p>영상 주인이 다른 앱에서 재생을 막았을 수 있어요 (오류 '+e.data+'). 유튜브 앱에서 보거나 다른 영상을 넣어주세요.</p><div class="btns"><button class="btn pri" data-act="ytapp">유튜브에서 열기</button></div></div>'}}});
  }).catch(function(){el.innerHTML='<div class="novid" style="background:var(--card);height:100%"><h3>인터넷 연결이 필요해요</h3><p>유튜브 영상은 인터넷이 있어야 나와요. 농구장에서 데이터 없이 보려면 <b>내 폰 영상</b>을 넣어두세요.</p></div>'});

var tLen=30,tEnd=0,tInt=null,actx=null;
function beep(n){
  try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();
    for(var i=0;i<n;i++){var o=actx.createOscillator(),g=actx.createGain();o.frequency.value=880;o.connect(g);g.connect(actx.destination);var t=actx.currentTime+i*0.3;g.gain.setValueAtTime(0.3,t);g.gain.exponentialRampToValueAtTime(0.001,t+0.25);o.start(t);o.stop(t+0.25)}}catch(e){}
  if(navigator.vibrate) navigator.vibrate([200,100,200]);
}
function startTimer(){
  beep(1);tEnd=Date.now()+tLen*1000;$('#tst').textContent='진행 중';$('[data-act=tgo]').textContent='멈춤';$('#timer').classList.add('ring');
  tInt=setInterval(function(){var left=(tEnd-Date.now())/1000;var n=$('#tnum');if(!n){stopTimer();return}
    n.textContent=fmtS(Math.ceil(left));if(left<=0){stopTimer();beep(3);$('#tst').textContent='끝! 쉬세요';$('#tnum').textContent='0:00'}},200);
}
function stopTimer(manual){
  clearInterval(tInt);tInt=null;tEnd=0;
  var b=$('[data-act=tgo]');if(b) b.textContent='시작';var t=$('#timer');if(t) t.classList.remove('ring');
  if(manual){$('#tst').textContent='멈춤';$('#tnum').textContent=fmtS(tLen)}
}

var wake=null;
function toggleWake(btn){
  if(wake){releaseWake();btn.style.background='';toast('화면 켜두기 끔');return}
  if(!navigator.wakeLock){toast('이 기기에서는 지원하지 않아요');return}
  navigator.wakeLock.request('screen').then(function(w){wake=w;btn.style.background='var(--acc-soft)';toast('훈련하는 동안 화면이 꺼지지 않아요');w.addEventListener('release',function(){wake=null})}).catch(function(){toast('화면 켜두기를 켤 수 없어요')});
}
function releaseWake(){if(wake){try{wake.release()}catch(e){}wake=null}}

    });
}

/* ---------- 기록 화면 ---------- */
function renderLog(){
  var logs=S.logs.slice().sort(function(a,b){return b.at-a.at});
  var days={};logs.forEach(function(l){days[l.date]=(days[l.date]||0)+1});
  var streak=0,d=new Date();
  if(!days[today()]) d.setDate(d.getDate()-1);
  while(true){var k=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');if(!days[k]) break;streak++;d.setDate(d.getDate()-1)}
  var weekAgo=Date.now()-7*864e5,wk=logs.filter(function(l){return l.at>=weekAgo});
  var wMin=wk.reduce(function(a,l){return a+(l.min||0)},0);
  /* 달력: 연습한 날 = 초록 + 횟수, 일지 쓴 날 = 📓, 날짜를 누르면 그날 기록만 */
  var lv=lview, mon=lv.month||today().slice(0,7), y=+mon.slice(0,4), mo=+mon.slice(5,7);
  var nDays=new Date(y,mo,0).getDate(), lead=new Date(y,mo-1,1).getDay(), monDays=0, tjs=S.tj||{};
  var cal='<div class="tjc-head"><button class="btn" data-lm="-1" aria-label="이전 달">◀</button><b>'+y+'년 '+mo+'월</b><button class="btn" data-lm="1" aria-label="다음 달">▶</button></div><div class="tjc-grid">'+
    '일월화수목금토'.split('').map(function(c,i){return '<span class="tjc-wd'+(i===0?' sun':i===6?' sat':'')+'">'+c+'</span>'}).join('');
  for(var i=0;i<lead;i++) cal+='<span></span>';
  for(var dn=1;dn<=nDays;dn++){var ds=mon+'-'+String(dn).padStart(2,'0'),n=days[ds]||0;if(n) monDays++;
    cal+='<button class="tjc-d lc'+(n?' on':'')+(ds===today()?' t':'')+(ds===lv.day?' sel':'')+'" data-ld="'+ds+'"><b>'+dn+'</b><span>'+(n?'🏀':'')+'</span><small>'+(n>1?n+'개':'')+(tjHas(tjs[ds])?'📓':'')+'</small></button>'}
  cal+='</div>';
  var shown=logs.filter(function(l){return lv.day?l.date===lv.day:l.date.slice(0,7)===mon});
  function dayName(dt){if(dt===today()) return '오늘';if(dt===tjShift(today(),-1)) return '어제';var x=new Date(dt+'T12:00:00');return (x.getMonth()+1)+'월 '+x.getDate()+'일 ('+'일월화수목금토'[x.getDay()]+')'}
  var html='<div class="top"><h1>훈련 기록</h1></div><div class="wrap">'+
    '<div class="card lcal">'+cal+'<p class="note" style="margin:8px 0 0;text-align:center">'+mo+'월에 <b>'+monDays+'일</b> 연습했어요 · 날짜를 누르면 그날 기록만 보여요</p></div>'+
    '<div class="bigstats"><div><span>🔥</span><b>'+streak+'일</b><small>연속 연습</small></div><div><span>🏀</span><b>'+wk.length+'번</b><small>이번 7일</small></div><div><span>⏱</span><b>'+wMin+'분</b><small>이번 7일</small></div></div>';
  if(!logs.length) html+='<div class="empty" style="font-size:18px">아직 기록이 없어요.<br>연습하고 <b>✓ 훈련 완료 기록하기</b>를 누르면 여기에 쌓여요.<br><br><a class="btn pri" href="#/" style="text-decoration:none;display:inline-block;padding:14px 22px">🏀 연습하러 가기</a></div>';
  if(logs.length&&lv.day) html+='<div class="lday"><b>'+dayName(lv.day)+'</b><span>'+(days[lv.day]||0)+'개</span><a class="btn sm" href="#/tj/'+lv.day+'">📓 이 날 일지</a><button class="btn sm" data-ld="'+lv.day+'">전체 보기</button></div>'+(shown.length?'':'<div class="empty">이 날은 연습 기록이 없어요</div>');
  else if(logs.length&&!shown.length) html+='<div class="empty">'+mo+'월에는 연습 기록이 없어요</div>';
  var last=lv.day||'';
  shown.forEach(function(l){
    if(l.date!==last){last=l.date;html+='<div class="lday"><b>'+dayName(l.date)+'</b><span>'+days[l.date]+'개</span><a class="btn sm" href="#/tj/'+l.date+'">📓 이 날 일지</a></div>'}
    html+='<div class="card lcard"><span class="lfeel">'+['','😣','🙂','😎'][l.feel||2]+'</span><div class="lbody"><a href="#/d/'+encodeURIComponent(l.id)+'">'+esc(l.name)+'</a>'+
      '<div class="lchips">'+[l.reps?'🔢 '+l.reps+'회':'',l.sets?l.sets+'세트':'',l.min?'⏱ '+l.min+'분':'',l.chkN?'✔ '+l.chk+'/'+l.chkN:''].filter(Boolean).map(function(x){return '<span>'+x+'</span>'}).join('')+'</div>'+
      (l.memo?'<div class="lmemo">'+esc(l.memo)+'</div>':'')+'</div><button class="iconbtn" data-del="'+l.at+'" aria-label="삭제">🗑</button></div>';
  });
  html+='</div>';
  $('#app').innerHTML=html;
  $$('[data-del]').forEach(function(b){b.onclick=function(){confirmSheet('이 기록을 지울까요?',function(){S.logs=S.logs.filter(function(l){return String(l.at)!==b.dataset.del});save();renderLog()})}});
  $$('[data-ld]').forEach(function(b){b.onclick=function(){lview.day=lview.day===b.dataset.ld?null:b.dataset.ld;renderLog()}});
  $$('[data-lm]').forEach(function(b){b.onclick=function(){var dt=new Date(y,mo-1+ +b.dataset.lm,1);lview.month=dt.getFullYear()+'-'+String(dt.getMonth()+1).padStart(2,'0');lview.day=null;renderLog()}});
}
var lview={month:null,day:null};

/* ---------- 내 훈련 추가/수정 ---------- */
function editDrillSheet(d){
  var e=d||{cat:CATS[0],level:'입문',steps:[],checks:[],mistakes:[]};
  sheet('<h3>'+(d?'내 훈련 수정':'내 훈련 추가')+'</h3>'+
    '<p class="note" style="margin:0">모아 둔 영상이나 코치에게 배운 동작을 나만의 훈련으로 만들 수 있어요. 저장한 뒤 영상을 붙이세요.</p>'+
    '<label class="field"><span>이름</span><input class="inp" id="nm" value="'+esc(e.name||'')+'" placeholder="예: 스핀 무브"></label>'+
    '<div class="two"><label class="field"><span>종류</span><select class="inp" id="ct">'+CATS.map(function(c){return '<option'+(c===e.cat?' selected':'')+'>'+c+'</option>'}).join('')+'</select></label>'+
    '<label class="field"><span>난이도</span><select class="inp" id="lv">'+['입문','초급','중급','고급'].map(function(c){return '<option'+(c===e.level?' selected':'')+'>'+c+'</option>'}).join('')+'</select></label></div>'+
    '<label class="field"><span>한 줄 설명</span><input class="inp" id="sm" value="'+esc(e.summary||'')+'"></label>'+
    '<label class="field"><span>단계별 동작 (한 줄에 하나씩)</span><textarea id="st" rows="5" placeholder="1단계 설명&#10;2단계 설명">'+esc(e.steps.join('\n'))+'</textarea></label>'+
    '<label class="field"><span>체크포인트 (한 줄에 하나씩)</span><textarea id="ck" rows="3">'+esc((e.checks||[]).join('\n'))+'</textarea></label>'+
    '<label class="field"><span>흔한 실수 → 고치는 법 (한 줄에 "실수 → 방법")</span><textarea id="ms" rows="3" placeholder="공을 내려다봄 → 벽의 점을 보며">'+esc((e.mistakes||[]).map(function(m){return m[0]+' → '+m[1]}).join('\n'))+'</textarea></label>'+
    '<div class="two"><label class="field"><span>준비물</span><input class="inp" id="eq" value="'+esc(e.equip||'')+'"></label><label class="field"><span>권장 훈련량</span><input class="inp" id="rp" value="'+esc(e.reps||'')+'"></label></div>'+
    '<div class="btns"><button class="btn pri" id="ok" style="flex:1">저장</button>'+(d?'<button class="btn" id="del" style="color:var(--bad)">삭제</button>':'')+'<button class="btn" id="no">취소</button></div>',function(s,close){
      $('#no',s).onclick=close;
      var lines=function(id){return $(id,s).value.split('\n').map(function(x){return x.trim()}).filter(Boolean)};
      $('#ok',s).onclick=function(){
        var nm=$('#nm',s).value.trim();if(!nm){toast('이름을 넣어주세요');return}
        var o={id:d?d.id:'my-'+Date.now().toString(36),custom:true,name:nm,cat:$('#ct',s).value,level:$('#lv',s).value,summary:$('#sm',s).value.trim(),
          steps:lines('#st'),checks:lines('#ck'),mistakes:lines('#ms').map(function(l){var p=l.split(/\s*(?:→|->)\s*/);return [p[0],p.slice(1).join(' → ')||'']}),
          equip:$('#eq',s).value.trim(),reps:$('#rp',s).value.trim(),q:[nm+' 농구']};
        if(d){S.custom=S.custom.map(function(x){return x.id===d.id?o:x})}else S.custom.push(o);
        save();close();if(d) renderDrill(o.id);else location.hash='#/d/'+encodeURIComponent(o.id);
      };
      var del=$('#del',s);if(del) del.onclick=function(){close();confirmSheet('"'+d.name+'" 훈련을 지울까요?',function(){S.custom=S.custom.filter(function(x){return x.id!==d.id});delete S.media[d.id];delete S.marks[d.id];delete S.stepT[d.id];vdb.del(d.id);save();location.hash='#/'})};
    });
}
